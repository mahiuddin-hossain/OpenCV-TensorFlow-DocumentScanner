plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.suitexen.opencv'
    compileSdk 36

    defaultConfig {
        applicationId "com.suitexen.opencv"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // ★ শুধু ARM ABI — x86 বাদ দাও (error এর কারণ)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // ★ এখানে correct relative path
    externalNativeBuild {
        cmake {
            path "../sdk/libcxx_helper/CMakeLists.txt"
            version "3.22.1+"
        }
    }
    packagingOptions {
        jniLibs {
            excludes += ['**/lib/**/x86/**', '**/lib/**/x86_64/**']
        }
        resources {
            excludes += ['**/lib/**/x86/**', '**/lib/**/x86_64/**']
        }
    }

    // ★ x86 এর জন্য C/C++ configure skip করো


}

dependencies {
    implementation project(':sdk')
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // ★ TensorFlow Lite — Latest Stable (2.16.1)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'
}